<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="snapTitle snapDesc">
  <title id="snapTitle">InsightFlow Command Center overview</title>
  <desc id="snapDesc">Illustration of the analytics dashboard: decision brief, issue bubble map, and ranked priority queue.</desc>
  <rect width="1200" height="900" rx="24" fill="#EDE9E0"/>
  <!-- browser chrome -->
  <rect x="1.5" y="1.5" width="1197" height="899" rx="23" fill="none" stroke="#2A2925" stroke-opacity="0.4" stroke-width="3"/>
  <line x1="0" y1="76" x2="1200" y2="76" stroke="#2A2925" stroke-opacity="0.4" stroke-width="3"/>
  <circle cx="52" cy="38" r="9" fill="#2A2925" fill-opacity="0.35"/>
  <circle cx="80" cy="38" r="9" fill="#2A2925" fill-opacity="0.35"/>
  <circle cx="108" cy="38" r="9" fill="#2A2925" fill-opacity="0.35"/>
  <rect x="150" y="20" width="420" height="36" rx="18" fill="#0C0C0B" fill-opacity="0.06"/>
  <text x="176" y="44" font-family="monospace" font-size="20" fill="#8B867B">insightflow · command center</text>
  <rect x="1010" y="20" width="140" height="36" rx="18" fill="#D4FF3A"/>
  <text x="1080" y="44" text-anchor="middle" font-family="monospace" font-size="19" fill="#0C0C0B">● live</text>

  <!-- decision brief card -->
  <g>
    <rect x="48" y="116" width="660" height="330" rx="16" fill="#F4F1E9" stroke="#2A2925" stroke-opacity="0.4" stroke-width="3"/>
    <rect x="48" y="116" width="10" height="330" fill="#D4FF3A"/>
    <rect x="88" y="152" width="190" height="34" rx="4" fill="#0C0C0B"/>
    <text x="98" y="176" font-family="monospace" font-size="19" letter-spacing="2" fill="#D4FF3A">FIX THIS FIRST</text>
    <text x="88" y="232" font-family="Georgia, serif" font-size="52" fill="#0C0C0B">Refund delays</text>
    <text x="88" y="272" font-family="monospace" font-size="21" fill="#8B867B">1,842 reports · 26.3% of volume · 81% negative</text>
    <text x="560" y="240" text-anchor="end" font-family="Georgia, serif" font-size="84" fill="#B32B1F">98.4</text>
    <!-- score breakdown bars -->
    <g font-family="monospace" font-size="19" fill="#8B867B">
      <text x="88" y="322">share</text>
      <rect x="190" y="304" width="300" height="14" rx="7" fill="#0C0C0B" fill-opacity="0.12"/>
      <rect x="190" y="304" width="252" height="14" rx="7" fill="#0C0C0B"/>
      <text x="88" y="356">negativity</text>
      <rect x="190" y="338" width="300" height="14" rx="7" fill="#0C0C0B" fill-opacity="0.12"/>
      <rect x="190" y="338" width="228" height="14" rx="7" fill="#FF5A4E"/>
      <text x="88" y="408">growth</text>
      <rect x="190" y="390" width="300" height="14" rx="7" fill="#0C0C0B" fill-opacity="0.12"/>
      <rect x="190" y="390" width="168" height="14" rx="7" fill="#D4FF3A" stroke="#0C0C0B" stroke-width="2"/>
    </g>
  </g>

  <!-- issue map card -->
  <g>
    <rect x="732" y="116" width="420" height="330" rx="16" fill="#161614"/>
    <text x="764" y="162" font-family="monospace" font-size="19" letter-spacing="2" fill="#8B867B">ISSUE MAP · 10 THEMES</text>
    <circle cx="850" cy="300" r="72" fill="#FF5A4E" fill-opacity="0.15" stroke="#FF5A4E" stroke-width="4"/>
    <circle cx="1000" cy="270" r="52" fill="#5DD6A2" fill-opacity="0.15" stroke="#5DD6A2" stroke-width="4"/>
    <circle cx="960" cy="370" r="40" fill="#8B867B" fill-opacity="0.2" stroke="#8B867B" stroke-width="4"/>
    <circle cx="800" cy="380" r="28" fill="#C96A2B" fill-opacity="0.2" stroke="#C96A2B" stroke-width="4"/>
    <circle cx="1070" cy="360" r="24" fill="#6D5BD0" fill-opacity="0.2" stroke="#6D5BD0" stroke-width="4"/>
    <circle cx="1078" cy="200" r="16" fill="#1F9B8E" fill-opacity="0.25" stroke="#1F9B8E" stroke-width="3"/>
    <circle cx="850" cy="300" r="80" fill="none" stroke="#D4FF3A" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
  </g>

  <!-- priority queue card -->
  <g>
    <rect x="48" y="470" width="1104" height="330" rx="16" fill="#F4F1E9" stroke="#2A2925" stroke-opacity="0.4" stroke-width="3"/>
    <text x="88" y="522" font-family="monospace" font-size="19" letter-spacing="2" fill="#8B867B">PRIORITY QUEUE · RANKED BY VOLUME + NEGATIVITY + GROWTH</text>
    <g font-family="Georgia, serif" fill="#0C0C0B">
      <rect x="88" y="548" width="46" height="46" rx="23" fill="#D4FF3A"/>
      <text x="111" y="580" text-anchor="middle" font-size="26">1</text>
      <text x="150" y="580" font-size="30">Refund delays</text>
      <rect x="700" y="560" width="360" height="16" rx="8" fill="#0C0C0B" fill-opacity="0.12"/>
      <rect x="700" y="560" width="340" height="16" rx="8" fill="#0C0C0B"/>
      <rect x="88" y="618" width="46" height="46" rx="23" fill="none" stroke="#2A2925" stroke-opacity="0.5" stroke-width="3"/>
      <text x="111" y="650" text-anchor="middle" font-size="26">2</text>
      <text x="150" y="650" font-size="30">Fake seller listings</text>
      <rect x="700" y="630" width="360" height="16" rx="8" fill="#0C0C0B" fill-opacity="0.12"/>
      <rect x="700" y="630" width="272" height="16" rx="8" fill="#C96A2B"/>
      <rect x="88" y="688" width="46" height="46" rx="23" fill="none" stroke="#2A2925" stroke-opacity="0.5" stroke-width="3"/>
      <text x="111" y="720" text-anchor="middle" font-size="26">3</text>
      <text x="150" y="720" font-size="30">Support response times</text>
      <rect x="700" y="700" width="360" height="16" rx="8" fill="#0C0C0B" fill-opacity="0.12"/>
      <rect x="700" y="700" width="216" height="16" rx="8" fill="#1F9B8E"/>
    </g>
  </g>

  <!-- footer strip -->
  <text x="48" y="852" font-family="monospace" font-size="21" fill="#8B867B">7,000 reports → 320 unique texts → ranked decisions with evidence</text>
  <text x="1152" y="852" text-anchor="end" font-family="monospace" font-size="21" fill="#8B867B">simulated demo timeline</text>
</svg>
